name: Instructor Radar
version: "2026.11.3"
slug: instructor_radar
description: A driving instructor's lesson schedule from the school's online planner, with change notifications
url: https://github.com/joachimcarrein/InstructorRadar
image: ghcr.io/joachimcarrein/instructor_radar
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
ingress: true
ingress_port: 8099
panel_icon: mdi:steering
panel_title: Instructor Radar
panel_admin: false
homeassistant_api: true
stdin: true
backup: hot
# Port 8100 (calendar feed for the Remote Calendar integration) is reached over the internal network only and is
# deliberately not listed under `ports`, so it is never mapped to the host.
# Only the planner login lives here; everything else is set inside the app (Settings).
options:
  provider: biqsdrive
  base_url: ""
  username: ""
  password: ""
  auth_mode: none
  totp_secret: ""
  log_level: info
schema:
  provider: list(biqsdrive)
  base_url: url
  username: str
  password: password
  auth_mode: list(none|totp|manual)
  totp_secret: password?
  log_level: list(trace|debug|info|warning|error)?
