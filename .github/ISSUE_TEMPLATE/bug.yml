name: Bug report
description: Something does not work as described in the documentation
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy:** do not paste student names, school addresses, your planner address or screenshots with real
        lessons. The app log at `info` level contains counts only and is safe to paste.
  - type: input
    id: version
    attributes:
      label: Instructor Radar version
      placeholder: "2026.12.0"
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version and installation type
      placeholder: "2026.11.0, Home Assistant OS on amd64"
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Planner (provider option)
      placeholder: biqsdrive
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce, with made-up names.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: App log
      description: Settings › Apps › Instructor Radar › Log (info level).
      render: text
