# Weekly update pull requests for Python packages, GitHub Actions (pinned by SHA) and the Docker base image.
# One PR per ecosystem (groups). The Python minor version of the base image is changed by hand (with CI's python-version).
version: 2
updates:
  - package-ecosystem: pip
    directory: /instructor_radar
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /instructor_radar
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
